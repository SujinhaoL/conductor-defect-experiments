# Y11-ARCH-001: official YOLO11s with one additional P2/4 detection path.
# The official backbone and standard P3/P4/P5 neck features are unchanged.

nc: 2
scale: s
scales:
  n: [0.50, 0.25, 1024]
  s: [0.50, 0.50, 1024]
  m: [0.50, 1.00, 512]
  l: [1.00, 1.00, 512]
  x: [1.00, 1.50, 512]

backbone:
  - [-1, 1, Conv, [64, 3, 2]]                    # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]]                   # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]]            # 2-P2/4 backbone feature
  - [-1, 1, Conv, [256, 3, 2]]                   # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]]            # 4-P3/8 backbone feature
  - [-1, 1, Conv, [512, 3, 2]]                   # 5-P4/16
  - [-1, 2, C3k2, [512, True]]                   # 6-P4/16 backbone feature
  - [-1, 1, Conv, [1024, 3, 2]]                  # 7-P5/32
  - [-1, 2, C3k2, [1024, True]]                  # 8
  - [-1, 1, SPPF, [1024, 5]]                     # 9
  - [-1, 2, C2PSA, [1024]]                       # 10-P5/32 backbone output

head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 11
  - [[-1, 6], 1, Concat, [1]]                    # 12 cat backbone P4
  - [-1, 2, C3k2, [512, False]]                  # 13-P4/16 head feature

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]]   # 14
  - [[-1, 4], 1, Concat, [1]]                    # 15 cat backbone P3
  - [-1, 2, C3k2, [256, False]]                  # 16-P3/8 head feature

  - [-1, 1, Conv, [256, 3, 2]]                   # 17
  - [[-1, 13], 1, Concat, [1]]                   # 18 cat head P4
  - [-1, 2, C3k2, [512, False]]                  # 19-P4/16 detection feature

  - [-1, 1, Conv, [512, 3, 2]]                   # 20
  - [[-1, 10], 1, Concat, [1]]                   # 21 cat head P5
  - [-1, 2, C3k2, [1024, True]]                  # 22-P5/32 detection feature

  # Minimal added P2 path. Standard layers 0-22 above remain identical to official YOLO11s.
  - [16, 1, nn.Upsample, [None, 2, "nearest"]]   # 23 upsample P3 to stride 4
  - [[-1, 2], 1, Concat, [1]]                    # 24 cat backbone P2
  - [-1, 2, C3k2, [128, False]]                  # 25-P2/4 detection feature

  - [[25, 16, 19, 22], 1, Detect, [nc]]          # 26 Detect(P2, P3, P4, P5)
